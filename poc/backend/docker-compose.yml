services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CAMERAS_FILE: /data/cameras.json
      MODEL_PATH: /models/yolo26s.onnx
      STORAGES_DIR: /storages
      FRONTEND_DIR: /frontend
    volumes:
      - ./app:/app/app
      - ../data:/data
      - ../models:/models:ro
      - ../storages:/storages
      - ../frontend:/frontend:ro
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--timeout-graceful-shutdown",
        "2",
      ]
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tranhan_ai
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
